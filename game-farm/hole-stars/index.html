<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a16" />
<title>Hole Stars — Neon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05050d; touch-action: none;
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .top { position: absolute; top: env(safe-area-inset-top, 12px); left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 16px; }

  .logo { font-weight: 900; font-size: 22px; letter-spacing: 1px; line-height: 1;
    text-shadow: 0 0 18px rgba(120,180,255,.8); }
  .logo .h { color: #6fd0ff; } .logo .s { color: #ffd84d; }
  .logo small { display:block; font-size:10px; font-weight:700; letter-spacing:3px;
    color:#b08bff; text-shadow:0 0 12px rgba(176,139,255,.8); margin-top:2px;}

  .timer { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .timer .clock { font-weight:800; font-size:20px; color:#fff;
    background:rgba(10,12,30,.55); border:1px solid rgba(120,160,255,.35);
    padding:6px 14px; border-radius:14px; backdrop-filter: blur(6px);
    box-shadow:0 0 18px rgba(80,120,255,.25); }
  .timer .score { font-weight:800; font-size:14px; color:#ffd84d;
    text-shadow:0 0 10px rgba(255,200,60,.7); }

  /* size pill that floats near the hole */
  #pill { position:absolute; transform:translate(-50%,-50%); pointer-events:none;
    font-weight:900; font-size:15px; color:#fff; white-space:nowrap;
    background:linear-gradient(180deg,#7be04a,#3fae2a); padding:5px 16px; border-radius:20px;
    border:2px solid rgba(255,255,255,.85); box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 22px rgba(120,255,90,.6);
    text-shadow:0 1px 2px rgba(0,0,0,.4); opacity:0; transition:opacity .3s; }

  /* score float popups */
  .pop { position:absolute; transform:translate(-50%,-50%); font-weight:900; font-size:16px;
    color:#fff; text-shadow:0 0 10px rgba(255,255,255,.8),0 2px 3px rgba(0,0,0,.6);
    pointer-events:none; animation:floatup .8s ease-out forwards; }
  @keyframes floatup { from{opacity:1;} to{opacity:0; transform:translate(-50%,-150%) scale(1.3);} }

  /* ---------- Screens ---------- */
  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center,rgba(20,16,46,.55),rgba(4,4,12,.92));
    backdrop-filter: blur(8px); }
  .screen.hidden { display:none; }
  .big-logo { font-weight:900; font-size:42px; letter-spacing:1px; line-height:1.05; }
  .big-logo .h{color:#6fd0ff; text-shadow:0 0 30px rgba(110,210,255,.9);}
  .big-logo .s{color:#ffd84d; text-shadow:0 0 30px rgba(255,216,77,.9);}
  .big-logo small{display:block;font-size:15px;letter-spacing:8px;color:#b08bff;margin-top:8px;
    text-shadow:0 0 18px rgba(176,139,255,.9);}
  .sub { color:#cfd6ff; font-size:15px; max-width:340px; line-height:1.5; opacity:.9; }
  .stat { color:#fff; font-size:18px; }
  .stat b { font-size:46px; color:#ffd84d; display:block; text-shadow:0 0 24px rgba(255,216,77,.8); }
  .btn { pointer-events:auto; cursor:pointer; border:none;
    font-weight:900; font-size:20px; color:#06210a; letter-spacing:.5px;
    background:linear-gradient(180deg,#8bff5a,#46c22a); padding:16px 44px; border-radius:18px;
    box-shadow:0 6px 0 #2b7d18,0 0 30px rgba(120,255,90,.55); transition:transform .08s; }
  .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #2b7d18,0 0 30px rgba(120,255,90,.55); }
  .hint { color:#8a93c4; font-size:13px; }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="top">
      <div class="logo"><span class="h">HOLE</span> <span class="s">STARS</span><small>NEON</small></div>
      <div class="timer">
        <div class="clock" id="clock">2:00</div>
        <div class="score" id="score">⭐ 0</div>
      </div>
    </div>
    <div id="pill">Size 1</div>
  </div>

  <!-- Start screen -->
  <div class="screen" id="startScreen">
    <div class="big-logo"><span class="h">HOLE</span> <span class="s">STARS</span><small>NEON</small></div>
    <div class="sub">Arraste o dedo para mover o buraco. Engula tudo que for menor que você e cresça. Quanto maior, mais coisas você devora!</div>
    <button class="btn" id="startBtn">JOGAR</button>
    <div class="hint">100% gerado por código • Three.js / WebGL</div>
  </div>

  <!-- Game over screen -->
  <div class="screen hidden" id="overScreen">
    <div class="big-logo"><span class="s">TEMPO!</span></div>
    <div class="stat">Você chegou ao <b id="finalSize">Size 1</b></div>
    <div class="stat" style="font-size:15px;color:#ffd84d;">⭐ Pontos: <span id="finalScore">0</span></div>
    <button class="btn" id="againBtn">JOGAR DE NOVO</button>
  </div>

  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>

  <script type="module">
  import * as THREE from 'three';

  // ============================================================= SETUP
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a18);
  scene.fog = new THREE.FogExp2(0x0a0a18, 0.018);

  const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);

  // ----- lighting (dim neon night) -----
  scene.add(new THREE.AmbientLight(0x4455aa, 1.1));
  const moon = new THREE.DirectionalLight(0x9fb4ff, 1.4);
  moon.position.set(-30, 55, 20);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024);
  moon.shadow.camera.near = 1; moon.shadow.camera.far = 160;
  moon.shadow.camera.left = -70; moon.shadow.camera.right = 70;
  moon.shadow.camera.top = 70; moon.shadow.camera.bottom = -70;
  scene.add(moon);
  // a warm "lava" glow from one side, like the orange horizon in the refs
  const ember = new THREE.PointLight(0xff5a2a, 1.6, 220, 1.6);
  ember.position.set(0, 18, -90);
  scene.add(ember);

  // ----- ground -----
  const FIELD = 130;
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x16361f, roughness: 1, metalness: 0 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(FIELD * 1.4, FIELD * 1.4), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // scattered glowing "star" specks on the ground for atmosphere
  const speckGeo = new THREE.BufferGeometry();
  const speckCount = 600, sp = new Float32Array(speckCount * 3);
  for (let i = 0; i < speckCount; i++) {
    sp[i*3]   = (Math.random()-.5) * FIELD * 1.3;
    sp[i*3+1] = 0.15;
    sp[i*3+2] = (Math.random()-.5) * FIELD * 1.3;
  }
  speckGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  const specks = new THREE.Points(speckGeo, new THREE.PointsMaterial({
    color: 0xffe27a, size: 0.9, transparent: true, opacity: 0.7,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(specks);

  // ============================================================= THE HOLE
  const hole = new THREE.Group();
  scene.add(hole);

  // dark disc (the void) sits just above ground
  const voidMesh = new THREE.Mesh(
    new THREE.CircleGeometry(1, 48),
    new THREE.MeshBasicMaterial({ color: 0x000008 }));
  voidMesh.rotation.x = -Math.PI / 2;
  voidMesh.position.y = 0.05;
  hole.add(voidMesh);

  // glowing neon rim
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(1, 0.12, 12, 60),
    new THREE.MeshStandardMaterial({ color: 0x46d8ff, emissive: 0x46d8ff, emissiveIntensity: 2.4,
      roughness: .3, metalness: .2 }));
  rim.rotation.x = -Math.PI / 2;
  rim.position.y = 0.12;
  hole.add(rim);

  // light that travels with the hole
  const holeLight = new THREE.PointLight(0x46d8ff, 2.2, 26, 1.8);
  holeLight.position.y = 4;
  hole.add(holeLight);

  let holeRadius = 1.6;       // world radius
  let holeSize = 1;           // displayed "Size N"
  let absorbed = 0;           // count for growth curve
  const holePos = new THREE.Vector2(0, 0);   // x,z on ground
  const target = new THREE.Vector2(0, 0);

  function applyHoleScale() {
    voidMesh.scale.setScalar(holeRadius);
    rim.scale.setScalar(holeRadius);
    holeLight.distance = 16 + holeRadius * 5;
  }
  applyHoleScale();

  // ============================================================= VOXEL ASSET FACTORY (procedural, no artist!)
  const box = (w, h, d, color, emissive = 0x000000, ei = 0) =>
    new THREE.Mesh(new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: ei,
        roughness: .8, metalness: .05, flatShading: true }));

  function finishVoxel(g) {
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    return g;
  }

  // tier defines how big the hole must be to eat it, and how much you grow
  const BUILDERS = [
    // 0 — glowing flower (always edible)
    () => { const g = new THREE.Group();
      g.add(box(.18, .9, .18, 0x2f7d34)).position.y = .45;
      const c = [0xff5ec7, 0x6fe0ff, 0xffe45e, 0xb06bff][Math.random()*4|0];
      const top = box(.7, .7, .7, c, c, 1.6); top.position.y = 1.05; g.add(top);
      return { obj: finishVoxel(g), size: .8, radius: .6, grow: .8, score: 1 }; },

    // 1 — bush
    () => { const g = new THREE.Group();
      for (let i=0;i<5;i++){ const b=box(.9,.9,.9,0x2c8a3a);
        b.position.set((Math.random()-.5)*1.2,.45+Math.random()*.4,(Math.random()-.5)*1.2); g.add(b);}
      return { obj: finishVoxel(g), size: 1.1, radius: 1.0, grow: 1.1, score: 2 }; },

    // 2 — pine tree
    () => { const g = new THREE.Group();
      const t = box(.5,1.4,.5,0x6b3d1f); t.position.y=.7; g.add(t);
      for(let i=0;i<3;i++){ const s=1.8-i*.5; const c=box(s,1.1,s,0x247a3c);
        c.position.y=1.6+i*.85; g.add(c);}
      const star=box(.4,.4,.4,0xffe45e,0xffe45e,2); star.position.y=4.2; g.add(star);
      return { obj: finishVoxel(g), size: 1.7, radius: 1.2, grow: 1.6, score: 4 }; },

    // 3 — little critter (animated idle bob)
    () => { const g = new THREE.Group();
      const c=[0xff7a7a,0x7affb0,0xffd36b,0x8db6ff][Math.random()*4|0];
      const body=box(1.1,1.0,1.4,c); body.position.y=.7; g.add(body);
      const head=box(.9,.9,.9,c); head.position.set(0,1.5,.55); g.add(head);
      const eL=box(.18,.18,.1,0x111111); eL.position.set(-.22,1.65,1.0); g.add(eL);
      const eR=eL.clone(); eR.position.x=.22; g.add(eR);
      g.userData.bob = true;
      return { obj: finishVoxel(g), size: 1.9, radius: 1.3, grow: 2.0, score: 7 }; },

    // 4 — house
    () => { const g = new THREE.Group();
      const wallC=[0xd9c9a3,0xb9d4e8,0xe8b9b9][Math.random()*3|0];
      const body=box(2.6,2.2,2.6,wallC); body.position.y=1.1; g.add(body);
      const roof=new THREE.Mesh(new THREE.ConeGeometry(2.3,1.6,4),
        new THREE.MeshStandardMaterial({color:0xc0392b,roughness:.8,flatShading:true}));
      roof.rotation.y=Math.PI/4; roof.position.y=3.0; g.add(roof);
      const door=box(.7,1.2,.1,0x5b3a1a); door.position.set(0,.6,1.32); g.add(door);
      const win=box(.6,.6,.1,0xffe45e,0xffe45e,1.3); win.position.set(-.8,1.4,1.32); g.add(win);
      return { obj: finishVoxel(g), size: 3.2, radius: 2.0, grow: 3.4, score: 18 }; },

    // 5 — tower / building
    () => { const g = new THREE.Group();
      const body=box(3.2,6.5,3.2,0x6c7a99); body.position.y=3.25; g.add(body);
      for(let y=0;y<4;y++)for(let x=-1;x<=1;x+=2){ const w=box(.6,.8,.1,0xfff0a0,0xfff0a0,1.4);
        w.position.set(x,1.4+y*1.5,1.62); g.add(w);}
      const top=box(2.2,1.2,2.2,0x556080); top.position.y=7.1; g.add(top);
      return { obj: finishVoxel(g), size: 4.6, radius: 2.6, grow: 5.0, score: 45 }; },
  ];

  // ============================================================= POPULATE FIELD
  const items = [];      // {mesh, size, radius, grow, score, eaten, bob}
  const MAX_ITEMS = 90;

  function spawnItem(tier, x, z) {
    const built = BUILDERS[tier]();
    const m = built.obj;
    m.position.set(x, 0, z);
    m.rotation.y = Math.random() * Math.PI * 2;
    scene.add(m);
    const it = { mesh: m, size: built.size, radius: built.radius, grow: built.grow,
      score: built.score, bob: m.userData.bob, phase: Math.random()*6, base: x*0.13+z*0.07 };
    items.push(it);
    return it;
  }

  function tierForSize(s) {
    // which tiers are reasonable to scatter given current hole size
    if (s < 2) return Math.random()<.7?0:1;
    if (s < 4) return [0,1,1,2,2,3][Math.random()*6|0];
    if (s < 7) return [1,2,2,3,3,4][Math.random()*6|0];
    return [2,3,3,4,4,5][Math.random()*6|0];
  }

  function randPos() {
    let x, z, ok, tries = 0;
    do { x=(Math.random()-.5)*FIELD; z=(Math.random()-.5)*FIELD;
      ok = (x*x+z*z) > 64; tries++; } while(!ok && tries<10);
    return [x, z];
  }

  function fillField() {
    while (items.length < MAX_ITEMS) {
      const [x,z] = randPos();
      spawnItem(tierForSize(holeSize), x, z);
    }
  }

  // ============================================================= PARTICLES (eat burst)
  const sparks = [];
  const sparkGeo = new THREE.SphereGeometry(0.18, 6, 6);
  function burst(x, z, color, n = 14) {
    for (let i=0;i<n;i++){
      const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color,
        transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
      m.position.set(x, 1, z);
      const a = Math.random()*Math.PI*2, s = 4+Math.random()*8;
      m.userData.v = new THREE.Vector3(Math.cos(a)*s, 6+Math.random()*6, Math.sin(a)*s);
      m.userData.life = 1;
      scene.add(m); sparks.push(m);
    }
  }

  // ============================================================= INPUT (drag to move)
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
  const hit = new THREE.Vector3();
  let dragging = false;

  function pointToGround(clientX, clientY) {
    ndc.x = (clientX/innerWidth)*2 - 1;
    ndc.y = -(clientY/innerHeight)*2 + 1;
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(groundPlane, hit)) {
      target.set(
        THREE.MathUtils.clamp(hit.x, -FIELD/2, FIELD/2),
        THREE.MathUtils.clamp(hit.z, -FIELD/2, FIELD/2));
    }
  }
  const onDown = e => { if(!playing) return; dragging = true;
    const t = e.touches?e.touches[0]:e; pointToGround(t.clientX, t.clientY); };
  const onMove = e => { if(!dragging||!playing) return;
    const t = e.touches?e.touches[0]:e; pointToGround(t.clientX, t.clientY); };
  const onUp = () => dragging = false;
  renderer.domElement.addEventListener('pointerdown', onDown);
  renderer.domElement.addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);

  // ============================================================= HUD refs + popups
  const elClock = document.getElementById('clock');
  const elScore = document.getElementById('score');
  const elPill  = document.getElementById('pill');
  const hud     = document.getElementById('hud');
  const proj = new THREE.Vector3();

  function popup(x, z, text) {
    proj.set(x, 2, z).project(camera);
    const sx = (proj.x*.5+.5)*innerWidth, sy = (-proj.y*.5+.5)*innerHeight;
    const d = document.createElement('div');
    d.className = 'pop'; d.textContent = text;
    d.style.left = sx+'px'; d.style.top = sy+'px';
    hud.appendChild(d);
    setTimeout(()=>d.remove(), 800);
  }

  // ============================================================= GAME STATE
  let playing = false;
  let score = 0;
  let timeLeft = 120;
  let shake = 0;

  function setSize(n) {
    holeSize = n;
    elPill.textContent = 'Size ' + n;
  }

  function resetGame() {
    items.forEach(it => scene.remove(it.mesh));
    items.length = 0;
    sparks.forEach(s => scene.remove(s)); sparks.length = 0;
    holeRadius = 1.6; absorbed = 0; setSize(1);
    holePos.set(0,0); target.set(0,0);
    hole.position.set(0,0,0);
    applyHoleScale();
    score = 0; timeLeft = 120; shake = 0;
    elScore.textContent = '⭐ 0';
    fillField();
  }

  function startGame() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('overScreen').classList.add('hidden');
    resetGame();
    playing = true;
    elPill.style.opacity = 1;
  }

  function endGame() {
    playing = false;
    elPill.style.opacity = 0;
    document.getElementById('finalSize').textContent = 'Size ' + holeSize;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('overScreen').classList.remove('hidden');
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('againBtn').onclick = startGame;

  // grow curve: each ~6 effective points of absorbed mass => +1 size
  function maybeGrow() {
    const newSize = 1 + Math.floor(absorbed / 6);
    if (newSize > holeSize) {
      setSize(newSize);
      holeRadius = 1.6 + (newSize - 1) * 0.85;
      applyHoleScale();
      shake = Math.min(shake + 0.6, 1.4);
    }
  }

  // ============================================================= MAIN LOOP
  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // timer
    if (playing) {
      timeLeft -= dt;
      if (timeLeft <= 0) { timeLeft = 0; endGame(); }
      const m = Math.floor(timeLeft/60), s = Math.floor(timeLeft%60);
      elClock.textContent = m + ':' + String(s).padStart(2,'0');
    }

    // move hole toward target
    if (playing) {
      const dir = target.clone().sub(holePos);
      const dist = dir.length();
      const speed = (16 + holeSize * 1.5);   // bigger = a touch faster
      if (dist > 0.01) {
        const step = Math.min(dist, speed * dt);
        dir.normalize().multiplyScalar(step);
        holePos.add(dir);
      }
      hole.position.set(holePos.x, 0, holePos.y);
    }

    // rim spin + pulse
    rim.rotation.z += dt * 0.6;
    rim.material.emissiveIntensity = 2.0 + Math.sin(now*0.005)*0.6;

    // eating + idle anim
    if (playing) {
      for (const it of items) {
        if (it.eaten) continue;
        // idle bob for critters
        if (it.bob) it.mesh.position.y = Math.sin(now*0.004 + it.phase) * 0.25;

        const dx = it.mesh.position.x - holePos.x;
        const dz = it.mesh.position.z - holePos.z;
        const d = Math.hypot(dx, dz);

        // can we swallow this? hole must be wide enough for the item size
        const edible = holeRadius >= it.size * 1.15;

        if (edible && d < holeRadius * 0.95) {
          it.eaten = true;
          it.fall = 0;
          it.color = (it.mesh.children[0]?.material?.color) || new THREE.Color(0x9fd8ff);
        } else if (edible && d < holeRadius + it.radius + 1.5) {
          // suck toward center when close enough
          const pull = (1 - (d - holeRadius) / (it.radius + 1.5)) * dt * 6;
          if (pull > 0) {
            it.mesh.position.x -= dx * pull * 0.25;
            it.mesh.position.z -= dz * pull * 0.25;
          }
        }
      }
    }

    // animate eaten items falling into the void
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (!it.eaten) continue;
      it.fall += dt;
      const m = it.mesh;
      // spiral down into hole
      const k = Math.min(it.fall / 0.45, 1);
      m.position.x += (holePos.x - m.position.x) * 0.35;
      m.position.z += (holePos.y - m.position.z) * 0.35;
      m.position.y = -k * 6;
      m.rotation.y += dt * 12;
      m.scale.setScalar(Math.max(0.001, 1 - k));
      if (k >= 1) {
        burst(holePos.x, holePos.y, it.color || new THREE.Color(0x9fd8ff));
        score += it.score; elScore.textContent = '⭐ ' + score;
        absorbed += it.grow;
        popup(holePos.x, holePos.y, '+' + it.score);
        maybeGrow();
        scene.remove(m);
        items.splice(i, 1);
      }
    }
    if (playing) fillField();   // keep the world populated

    // particles
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.userData.life -= dt * 1.6;
      s.userData.v.y -= 22 * dt;
      s.position.addScaledVector(s.userData.v, dt);
      s.material.opacity = Math.max(0, s.userData.life);
      s.scale.setScalar(Math.max(0.01, s.userData.life));
      if (s.userData.life <= 0) { scene.remove(s); sparks.splice(i,1); }
    }

    // camera follows the hole from a high angle (like the refs)
    const camH = 26 + holeRadius * 3.4;
    const camBack = 20 + holeRadius * 2.6;
    let cx = holePos.x, cz = holePos.y + camBack;
    if (shake > 0) {
      cx += (Math.random()-.5)*shake*1.4;
      cz += (Math.random()-.5)*shake*1.4;
      shake = Math.max(0, shake - dt*2.5);
    }
    camera.position.lerp(new THREE.Vector3(cx, camH, cz), 0.12);
    camera.lookAt(holePos.x, 0, holePos.y - 2);

    specks.rotation.y += dt * 0.01;
    ember.intensity = 1.4 + Math.sin(now*0.002)*0.4;

    // keep size pill glued to the hole on screen
    if (playing) {
      proj.set(holePos.x, 0.5, holePos.y).project(camera);
      elPill.style.left = ((proj.x*.5+.5)*innerWidth) + 'px';
      elPill.style.top  = ((-proj.y*.5+.5)*innerHeight) + 'px';
    }

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  // initial camera + idle field behind the start menu
  camera.position.set(0, 34, 30);
  camera.lookAt(0,0,0);
  fillField();
  requestAnimationFrame(tick);

  // ============================================================= RESIZE
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  </script>
</body>
</html>
