name: Build Hole Stars APK

# Compila o APK do jogo Hole Stars (game-farm/hole-stars) e publica como artifact.
# Rode manualmente em Actions -> "Build Hole Stars APK" -> "Run workflow",
# ou automaticamente quando algo em game-farm/hole-stars mudar.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "game-farm/hole-stars/**"
      - ".github/workflows/build-hole-stars-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-farm/hole-stars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hole-stars-debug-apk
          path: game-farm/hole-stars/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
